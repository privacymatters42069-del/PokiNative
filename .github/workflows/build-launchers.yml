name: Build and Release PokiNative

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:   # manual run: builds artifacts only

permissions:
  contents: read

jobs:
  build-artifacts:
    uses: ./.github/workflows/build-launcher-artifacts.yml
    permissions:
      contents: read

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all build files
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ls -l release-assets

          # Use docs/releases/<tag>.md as notes if it exists, else auto-generate
          if [ -f "docs/releases/$tag.md" ]; then
            notes=(--notes-file "docs/releases/$tag.md")
          else
            notes=(--generate-notes)
          fi

          draft_state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$draft_state" = "false" ]; then
            echo "Refusing to modify an already published release: $tag" >&2
            exit 1
          elif [ "$draft_state" = "true" ]; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --draft \
              --verify-tag --title "PokiNative $tag" "${notes[@]}"
          fi