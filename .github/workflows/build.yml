name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New numeric version, for example 0.4.6.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Validate input
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Run this workflow on a branch, not a tag."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Version must be numeric, such as 0.4.6.3."
            exit 1
          fi

      - name: Check out the selected branch and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag and find previous release
        id: release_context
        shell: bash
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::Tag $VERSION already exists. Choose a new version."
            exit 1
          fi

          if [[ -e "docs/releases/$VERSION.md" ]]; then
            echo "::error::docs/releases/$VERSION.md already exists; refusing to overwrite it."
            exit 1
          fi

          if ! previous_tag="$(git describe --tags --abbrev=0 --match '[0-9]*' "$GITHUB_SHA" 2>/dev/null)"; then
            echo "::error::Could not find a previous numeric version tag."
            exit 1
          fi

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Preparing $VERSION from changes since $previous_tag."

      - name: Set both launcher versions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          projects = (
              Path("launcher/KarPurLauncher.csproj"),
              Path("launcher-linux/KarPurLauncher.Linux.csproj"),
          )

          for path in projects:
              if not path.is_file():
                  raise SystemExit(f"Required project file is missing: {path}")

              text = path.read_text(encoding="utf-8")
              pattern = re.compile(r"(<Version>)[^<]*(</Version>)")
              updated, count = pattern.subn(
                  lambda match: f"{match.group(1)}{version}{match.group(2)}",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one <Version> element in {path}")

              path.write_text(updated, encoding="utf-8", newline="")
              print(f"Set {path} to {version}")
          PY

      - name: Generate release notes from the previous tag
        env:
          PREVIOUS_TAG: ${{ steps.release_context.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs/releases
          notes_file="docs/releases/$VERSION.md"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=$VERSION" \
            -f "target_commitish=$GITHUB_SHA" \
            -f "previous_tag_name=$PREVIOUS_TAG" \
            --jq '.body' > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::GitHub generated an empty release-notes file."
            exit 1
          fi

          echo "Created $notes_file"

      - name: Commit and push the release preparation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            launcher/KarPurLauncher.csproj \
            launcher-linux/KarPurLauncher.Linux.csproj \
            "docs/releases/$VERSION.md"

          if git diff --cached --quiet; then
            echo "::error::There are no release-preparation changes to commit."
            exit 1
          fi

          git commit -m "Prepare release $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
